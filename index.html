<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Belajar, Flashcard & Kuis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <h1>Minna no Nihongo</h1>
      <p>Aplikasi Belajar Kosakata N5</p>
    </header>

    <!-- Menu Utama -->
    <section id="menu-screen" class="screen active">
      <!-- Tab Mode Utama -->
      <div class="mode-tabs">
        <button id="tab-study" class="btn-tab active" onclick="switchMode('study')">📖 Belajar</button>
        <button id="tab-flashcard" class="btn-tab" onclick="switchMode('flashcard')">🎴 Flashcard</button>
        <button id="tab-quiz" class="btn-tab" onclick="switchMode('quiz')">📝 Kuis</button>
      </div>

      <!-- Sub-Tab Mode Kuis -->
      <div id="quiz-type-tabs" class="sub-mode-tabs hidden">
        <button id="quiz-type-jp-id" class="btn-sub-tab active" onclick="switchQuizType('jp-id')">Jepang ➔ Indonesia (Pilihan)</button>
        <button id="quiz-type-id-jp" class="btn-sub-tab" onclick="switchQuizType('id-jp')">Indonesia ➔ Jepang (Ketik)</button>
      </div>

      <h2 id="menu-title">Pilih Bab Belajar</h2>
      <div id="chapter-grid" class="chapter-grid">
        <!-- Generasi Tombol Bab via JS -->
      </div>
    </section>

    <!-- Halaman Belajar (Daftar Kosakata) -->
    <section id="study-screen" class="screen">
      <div class="quiz-header">
        <button class="btn-back" onclick="showMenu()">← Menu</button>
        <span id="study-chapter-title">Bab 1</span>
        <span id="study-count-text">0 Kata</span>
      </div>

      <div id="vocab-list" class="vocab-list">
        <!-- List Kosakata via JS -->
      </div>
    </section>

    <!-- Halaman Flashcard -->
    <section id="flashcard-screen" class="screen">
      <div class="quiz-header">
        <button class="btn-back" onclick="showMenu()">← Menu</button>
        <span id="fc-chapter-title">Bab 1</span>
        <span id="fc-progress-text">1 / 44</span>
      </div>

      <div class="flashcard-wrapper" onclick="flipCard()">
        <div id="flashcard" class="flashcard">
          <div class="card-face card-front">
            <span class="fc-hint">Klik/Ketuk untuk balik</span>
            <h2 id="fc-kanji">わたし</h2>
            <p id="fc-sub">(watashi)</p>
          </div>
          <div class="card-face card-back">
            <span class="fc-hint">Arti Bahasa Indonesia</span>
            <h2 id="fc-meaning">saya</h2>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn-fc-nav" onclick="prevCard()">←</button>
        <button class="btn-fc-nav" onclick="shuffleFlashcards()">🔀 Acak</button>
        <button class="btn-fc-nav" onclick="nextCard()">→</button>
      </div>
    </section>

    <!-- Halaman Kuis -->
    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <button class="btn-back" onclick="showMenu()">← Menu</button>
        <span id="chapter-title">Bab 1</span>
        <span id="progress-text">Soal 1 / 44</span>
      </div>

      <div class="card">
        <p id="question-label" class="question-label">Apa arti dari kata berikut?</p>
        <h2 id="question-text">わたし</h2>
        <p id="sub-question" class="sub-text">(watashi)</p>
      </div>

      <!-- Pilihan Ganda -->
      <div id="options-container" class="options-grid"></div>

      <!-- Input Mengetik -->
      <div id="input-container" class="input-container hidden">
        <input type="text" id="user-input" placeholder="Ketik Hiragana/Romaji..." autocomplete="off" onkeydown="handleKeyPress(event)">
        <button class="btn-primary" onclick="checkTypedAnswer()">Kirim</button>
      </div>

      <div id="feedback" class="feedback-msg"></div>

      <button id="btn-next" class="btn-secondary hidden" onclick="nextQuestion()">Soal Berikutnya</button>
    </section>

    <!-- Halaman Hasil Kuis -->
    <section id="result-screen" class="screen">
      <h2>Selesai!</h2>
      <div class="score-card">
        <p>Skor Akhir Kamu:</p>
        <h1 id="final-score">0 / 0</h1>
      </div>
      <button class="btn-primary" onclick="showMenu()">Kembali ke Menu</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
